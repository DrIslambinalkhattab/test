<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة اليوم · منية النصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:TajawalLocal;font-weight:400;src:local('Tajawal'),local('Tajawal Regular'),local('Tajawal-Regular')}
@font-face{font-family:TajawalLocal;font-weight:500;src:local('Tajawal Medium'),local('Tajawal-Medium'),local('Tajawal')}
@font-face{font-family:TajawalLocal;font-weight:700;src:local('Tajawal Bold'),local('Tajawal-Bold'),local('Tajawal')}
:root{--bg:#f2f5fa;--panel:#fff;--panel2:#f7f9fc;--line:rgba(15,23,42,.08);--tx:#0f1a2b;--mu:#6b7686;--ac:#3f84b8;--ac2:#6fb1e3;--sh:0 1px 2px rgba(15,23,42,.04),0 12px 32px -12px rgba(30,60,100,.18);--pill:#101826;--warm:#e8a04a;--ok:#2f8f5b}
[data-theme=dark]{--bg:#080b12;--panel:#0e131c;--panel2:#121925;--line:rgba(255,255,255,.07);--tx:#eef3fa;--mu:#8c97a8;--ac:#5a9fd4;--ac2:#8cc4f0;--sh:0 1px 2px rgba(0,0,0,.4),0 16px 40px -14px rgba(0,0,0,.7);--pill:#131b29;--ok:#5bc58a}
*{box-sizing:border-box;margin:0}
body{font-family:'Tajawal',TajawalLocal,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:24px 20px 64px;transition:background .4s}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(60% 40% at 80% 0,color-mix(in srgb,var(--ac) 14%,transparent),transparent),radial-gradient(40% 30% at 0 100%,color-mix(in srgb,var(--ok) 8%,transparent),transparent);pointer-events:none}
.wrap{position:relative;max-width:1160px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:22px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill{display:flex;align-items:center;gap:12px;background:var(--pill);color:#fff;padding:8px 18px 8px 10px;border-radius:99px;box-shadow:var(--sh);border:1px solid var(--line);font-size:14px;font-weight:600}
.pill b{color:var(--warm);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.pill .d{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:14px}
.pill{cursor:pointer;user-select:none;transition:.3s}.pill:hover{transform:translateY(-1px)}.pill .d svg{transition:transform .4s cubic-bezier(.2,.8,.2,1)}body.tm .pill .d svg{transform:rotate(180deg)}
.tw{width:100%;display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1),opacity .4s;margin-top:-22px}.tw>div{overflow:hidden;padding:4px 0 8px}body.tm .tw{grid-template-rows:1fr;opacity:1;margin-top:0}
.times{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.t{width:78px;padding:11px 0 10px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:center;transition:.35s cubic-bezier(.2,.8,.2,1);position:relative}
.t:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.t small{display:block;font-size:11.5px;color:var(--mu);font-weight:600}.t strong{display:block;font-size:15px;margin:7px 0 4px;font-variant-numeric:tabular-nums}.t em{font-style:normal;font-size:11px;color:var(--mu)}
.t.on{background:linear-gradient(160deg,var(--ac2),var(--ac));border-color:transparent;color:#fff;transform:translateY(-4px);box-shadow:0 14px 28px -10px var(--ac)}
.t.on small,.t.on em{color:rgba(255,255,255,.85)}
.t.past{opacity:.55}
.hero{width:100%;display:grid;grid-template-columns:1.1fr .9fr 320px;gap:28px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:34px 36px;box-shadow:var(--sh)}
.main{display:flex;flex-direction:column;gap:18px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mu);background:var(--panel2);border:1px solid var(--line);padding:7px 14px;border-radius:99px}
.chip.g{position:relative;overflow:hidden;color:#fff;border:0;background:linear-gradient(110deg,#2a8553,#52d38d,#2a8553);background-size:220% 100%;animation:flow 3.5s linear infinite,glow 2.4s ease-in-out infinite}
.chip.g:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(130%);animation:shine 2.8s ease-in-out infinite}
.chip.g svg{animation:zap 1.6s ease-in-out infinite}
@keyframes flow{to{background-position:-220% 0}}
@keyframes shine{0%{transform:translateX(130%)}55%,100%{transform:translateX(-130%)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(82,211,141,.0),0 4px 14px -6px rgba(82,211,141,.5)}50%{box-shadow:0 0 0 5px rgba(82,211,141,.14),0 6px 20px -4px rgba(82,211,141,.8)}}
@keyframes zap{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(-12deg)}}
@media(prefers-reduced-motion:reduce){.chip.g,.chip.g:after,.chip.g svg{animation:none}}
.dtc{position:absolute;top:18px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:1}
.hero{position:relative;padding-top:70px!important}
@media(max-width:560px){.dtc{white-space:normal;text-align:center;width:calc(100% - 40px);justify-content:center}.hero{padding-top:84px!important}}
h1{font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.5px}
.temp{display:flex;align-items:center;gap:16px}
.temp .n{font-size:76px;font-weight:700;line-height:1;color:var(--ac);font-variant-numeric:tabular-nums}
.temp .n sup{font-size:24px;vertical-align:top;margin-inline-end:4px;opacity:.8}
.temp p{font-size:13px;color:var(--mu)}.temp strong{display:block;font-size:17px;color:var(--tx);margin-top:3px}
.note{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 14%,var(--panel)),var(--panel2));border:1px solid color-mix(in srgb,var(--ac) 25%,transparent);border-inline-end:3px solid var(--ac)}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:linear-gradient(160deg,var(--ac2),var(--ac));color:#fff;flex:none;box-shadow:0 8px 18px -8px var(--ac)}
.note b{font-size:15px}.note p{font-size:12.5px;color:var(--mu);margin-top:2px}
.seg{display:flex;gap:5px;margin-top:9px}.seg i{flex:1;height:4px;border-radius:9px;background:color-mix(in srgb,var(--ac) 18%,transparent)}.seg i.f{background:var(--ac)}
.ringbox{position:relative;display:grid;place-items:center}
.ringbox svg{width:100%;max-width:230px;transform:rotate(-90deg)}
.ringbox .c{position:absolute;text-align:center}
.c .big{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}.c small{display:block;font-size:12px;color:var(--mu);font-weight:600}
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--panel2);border:1px solid var(--line);transition:.3s}
.card:hover{transform:translateX(-4px);box-shadow:var(--sh)}
.card .ico{background:var(--panel);color:var(--ac);box-shadow:none;border:1px solid var(--line);width:42px;height:42px}
.card small{font-size:12px;color:var(--mu);font-weight:600;display:block}.card b{font-size:22px}.card span{font-size:12px;color:var(--mu);margin-inline-start:6px}
.card .nt{font-size:11.5px;color:var(--mu);margin-top:2px}
.gear{position:fixed;bottom:22px;inset-inline-start:22px;width:46px;height:46px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);display:grid;place-items:center;font-size:19px;opacity:.55;transition:.3s;z-index:5}
.gear:hover{opacity:1;transform:rotate(60deg)}
.ov{position:fixed;inset:0;background:rgba(5,8,14,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s;z-index:9}
.dr{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(440px,100%);background:var(--panel);border-inline-end:1px solid var(--line);transform:translateX(100%);transition:.45s cubic-bezier(.2,.8,.2,1);z-index:10;display:flex;flex-direction:column;box-shadow:var(--sh)}
body.open .ov{opacity:1;pointer-events:auto}body.open .dr{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}.dh h2{font-size:18px}
.tabs{display:flex;gap:6px;padding:12px 22px 0}.tabs button{padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mu)}.tabs .a{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
.db{flex:1;overflow:auto;padding:18px 22px 30px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mu);font-weight:600}
input,select,textarea{font:inherit;font-size:14px;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0;width:100%;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ec{padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);display:flex;flex-direction:column;gap:8px}
.ec .row{grid-template-columns:2fr 1fr 1fr}
.btn{padding:10px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:.2s}
.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);color:#fff;border:0}.btn.x{color:#d65a5a}
.adj{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}.adj input{width:84px;text-align:center}
.sw{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.qp{align-self:stretch;min-height:250px;display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(165deg,color-mix(in srgb,var(--ac) 11%,var(--panel2)),var(--panel2) 60%);border:1px solid var(--line)}
.qp:before{content:"”";position:absolute;inset-inline-start:14px;bottom:-62px;font:700 190px/1 Georgia,serif;color:var(--ac);opacity:.07;pointer-events:none}
.qh{display:flex;align-items:center;gap:11px}.qh>div{flex:1}.qh b{font-size:14px;display:block}.qh small{font-size:11.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.qi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;color:#fff;background:linear-gradient(160deg,var(--ac2),var(--ac));box-shadow:0 8px 18px -8px var(--ac)}
.qn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--mu);border:1px solid var(--line);background:var(--panel);transition:.3s}.qn:hover{color:var(--ac);transform:rotate(180deg);border-color:var(--ac)}
.qb{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;transition:opacity .38s,transform .38s;position:relative}.qb.o{opacity:0;transform:translateY(8px)}
.qb blockquote{font-size:19px;line-height:1.85;font-weight:500;letter-spacing:-.1px}.qb blockquote.em{font-size:14px;color:var(--mu)}
.qb cite{font-style:normal;font-size:12.5px;color:var(--mu);font-weight:700;display:flex;align-items:center;gap:10px}.qb cite:not(:empty):before{content:"";width:22px;height:2px;border-radius:2px;background:var(--ac)}
.qf{height:3px;border-radius:3px;background:color-mix(in srgb,var(--ac) 14%,transparent);overflow:hidden}.qf i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:3px;transition:width 1s linear}
.eq{padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);display:flex;flex-direction:column;gap:8px}.eq .r{display:flex;gap:8px}
@media(max-width:980px){.hero{grid-template-columns:1fr;padding:26px}.ringbox{order:-1}.ringbox svg{max-width:190px}h1{font-size:36px}}
@media(max-width:560px){.t{width:calc(33.3% - 8px)}.times{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="pill" id="pill"></div>
  <div class="tw"><div><div class="times" id="times"></div></div></div>
  <section class="hero" id="hero"></section>
</div>
<button class="gear" id="gear" aria-label="تخصيص"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr"></aside>
<script>
const TZ='Africa/Cairo',LAT=31.0833,LNG=31.65;
const IC={flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',medal:'<circle cx="12" cy="9" r="5"/><path d="M9 13.5 7.5 21 12 18.5l4.5 2.5L15 13.5"/>',list:'<path d="M10 6h11M10 12h11M10 18h11M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',wind:'<path d="M3 9h10a3 3 0 1 0-3-3M3 15h14a3 3 0 1 1-3 3M3 12h6"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',cloud:'<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 10.5 3.8 3.8 0 0 1 17 18z"/>',rain:'<path d="M7 14a4 4 0 0 1-.5-8A6 6 0 0 1 18 6.5 3.8 3.8 0 0 1 17 14zM8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',sunrise:'<path d="M12 3v5M5 12h2M17 12h2M7 17a5 5 0 0 1 10 0M3 17h18M9 6l3-3 3 3"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',chev:'<path d="m6 9 6 6 6-6"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',plus:'<path d="M12 5v14M5 12h14"/>',down:'<path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/>',up:'<path d="M12 21V9m0 0-4 4m4-4 4 4M5 3h14"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',quote:'<path d="M3 21c3 0 7-1 7-8V5c0-1.25-.76-2-2-2H4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h4M14 21c3 0 7-1 7-8V5c0-1.25-.76-2-2-2h-4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h4"/>',shuf:'<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>'};
const I=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24">${IC[n]||''}</svg>`;
const ICOPTS=['flame','medal','list','drop','wind','sun','star','clock','target','bolt'];
const PN={fajr:'الفجر',sunrise:'الشروق',ishraq:'الإشراق',duha:'الضحى',dhuhr:'الظهر',asr:'العصر',maghrib:'المغرب',isha:'العشاء'};
const METHODS={egypt:['الهيئة المصرية العامة للمساحة',19.5,17.5],mwl:['رابطة العالم الإسلامي',18,17],karachi:['جامعة العلوم الإسلامية — كراتشي',18,18],isna:['أمريكا الشمالية (ISNA)',15,15]};
const DEF={theme:'dark',method:'egypt',asr:1,h12:true,showTimes:false,qEvery:60,quotes:[{id:1,text:'من جدّ وجد، ومن زرع حصد',author:'مثل عربي'},{id:2,text:'الوقت كالسيف إن لم تقطعه قطعك',author:'مثل عربي'},{id:3,text:'ما ضاع حقٌّ وراءه مطالب',author:'مثل عربي'},{id:4,text:'إِنَّ مَعَ الْعُسْرِ يُسْرًا',author:'سورة الشرح'},{id:5,text:'وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا',author:'سورة الطلاق'},{id:6,text:'خير الأمور أوسطها',author:'مثل عربي'},{id:7,text:'العلم في الصغر كالنقش على الحجر',author:'مثل عربي'}],adj:{fajr:0,sunrise:0,ishraq:0,duha:0,dhuhr:0,asr:0,maghrib:0,isha:0},weather:true,
 place:'منية النصر · الدقهلية',gMode:'auto',gText:'أهلاً بك',chipText:'يوم حيّ',
 note:{icon:'sunrise',title:'ابدأ يومك بذكر الله',text:'صلاة في وقتها، وخطوة صغيرة نحو يوم أفضل'},
 cards:[{id:1,icon:'flame',label:'أفضل سلسلة',value:'0',unit:'يوم',note:''},{id:2,icon:'medal',label:'أيام مثالية هذا الشهر',value:'0',unit:'يوم',note:''},{id:3,icon:'list',label:'إجمالي المهام',value:'21',unit:'مهمة',note:''}]};
let S=load();
function load(){try{return Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem('dash')||'{}'))}catch(e){return structuredClone(DEF)}}
const save=()=>{try{localStorage.setItem('dash',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
/* ---------- حساب المواقيت ---------- */
const R=Math.PI/180,sin=a=>Math.sin(a*R),cos=a=>Math.cos(a*R),fx=(h)=>((h%24)+24)%24;
function cairoParts(d){const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).map(x=>[x.type,x.value]));return{y:+p.year,m:+p.month,d:+p.day,h:+p.hour%24,mi:+p.minute}}
function tzOff(d){const s=new Intl.DateTimeFormat('en',{timeZone:TZ,timeZoneName:'shortOffset'}).formatToParts(d).find(x=>x.type==='timeZoneName').value;return parseFloat(s.replace('GMT',''))||0}
function dayTimes(off){
 const n=cairoParts(new Date()),base=Date.UTC(n.y,n.m-1,n.d+off),tz=tzOff(new Date(base+12*36e5));
 const D=base/864e5+0.5+2440587.5-2451545-0.0;const jd=D-LNG/360;
 const g=(357.529+.98560028*jd)%360,q=(280.459+.98564736*jd)%360,L=q+1.915*sin(g)+.02*sin(2*g),e=23.439-3.6e-7*jd;
 let ra=Math.atan2(cos(e)*sin(L),cos(L))/R/15;ra=fx(ra);const eq=q/15-ra,dec=Math.asin(sin(e)*sin(L))/R;
 const mid=12+tz-LNG/15-((eq+12)%24-12);
 const T=a=>Math.acos((-sin(a)-sin(dec)*sin(LAT))/(cos(dec)*cos(LAT)))/R/15;
 const m=METHODS[S.method],al=Math.atan(1/(S.asr+Math.tan(Math.abs(LAT-dec)*R)))/R;
 const asr=Math.acos((sin(al)-sin(dec)*sin(LAT))/(cos(dec)*cos(LAT)))/R/15;
 const raw={fajr:mid-T(m[1]),sunrise:mid-T(.833),ishraq:mid-T(.833)+10/60,duha:mid-T(.833)+1.5,dhuhr:mid+.05,asr:mid+asr,maghrib:mid+T(.833),isha:mid+T(m[2])};
 const o={};for(const k in raw)o[k]=new Date(base+(raw[k]-tz)*36e5+(S.adj[k]||0)*6e4);return o}
const fmt=(d,p)=>new Intl.DateTimeFormat('ar-EG-u-nu-latn',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:S.h12}).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
/* ---------- الطقس ---------- */
let W=JSON.parse(localStorage.getItem('dashW')||'null');
const WC=c=>c===0?['صافٍ','sun']:c<3?['غائم جزئيًا','cloud']:c<4?['غائم','cloud']:c<50?['ضباب','cloud']:c<70||c>79&&c<87?['أمطار','rain']:c>94?['عاصفة رعدية','rain']:['غائم','cloud'];
async function getW(){if(!S.weather)return;try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LNG}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Africa%2FCairo`);const j=await r.json();W={t:j.current.temperature_2m,f:j.current.apparent_temperature,h:j.current.relative_humidity_2m,w:j.current.wind_speed_10m,c:j.current.weather_code,hi:j.daily.temperature_2m_max[0],lo:j.daily.temperature_2m_min[0],at:Date.now()};localStorage.setItem('dashW',JSON.stringify(W));renderHero()}catch(e){}}
/* ---------- الواجهة ---------- */
let cur=null;
function render(){const n=new Date(),all=[-1,0,1].flatMap(o=>Object.entries(dayTimes(o)).map(([k,v])=>({k,v}))).sort((a,b)=>a.v-b.v);
 const nx=all.find(x=>x.v>n),pv=[...all].reverse().find(x=>x.v<=n);cur={nx,pv,today:dayTimes(0)};
 const left=Math.max(0,nx.v-n),s=Math.floor(left/1e3),z=v=>String(v).padStart(2,'0');
 $('pill').innerHTML=`<span class="d">${I('chev')}</span>متبقٍ على ${PN[nx.k]} <b>${z(Math.floor(s/3600))}:${z(Math.floor(s%3600/60))}:${z(s%60)}</b>`;
 const ring=document.getElementById('rg');if(ring){const pr=(n-pv.v)/(nx.v-pv.v);ring.style.strokeDashoffset=(1-pr)*traw;$('rp').textContent=Math.round(pr*100)+'%'}}
function renderTimes(){const T=cur.today,n=new Date();$('times').innerHTML=Object.keys(PN).map(k=>{const f=fmt(T[k]);return`<div class="t ${cur.nx.k===k&&cur.nx.v-n<864e5&&!isTomorrowFajr()?'on':''} ${T[k]<n?'past':''}"><small>${PN[k]}</small><strong>${f.hour}:${f.minute}</strong><em>${f.dayPeriod?f.dayPeriod.replace(/[\u200f]/g,''):'&nbsp;'}</em></div>`}).join('')}
const isTomorrowFajr=()=>cur.nx.v>cur.today.isha;
const traw=2*Math.PI*84;
let qi=-1,qAt=Date.now();
const qHTML=q=>q?`<blockquote>${esc(q.text)}</blockquote><cite>${esc(q.author||'')}</cite>`:'<blockquote class="em">لا توجد اقتباسات بعد — أضفها من الإعدادات</blockquote>';
const pickQ=()=>{const n=S.quotes.length;if(!n)return -1;if(n==1)return 0;let i;do{i=Math.random()*n|0}while(i===qi);return i};
const cnt=()=>{const c=$('qc');if(c)c.textContent=S.quotes.length&&qi>=0?`${qi+1} / ${S.quotes.length}`:''};
function nextQ(){qAt=Date.now();qi=pickQ();const el=$('qb');if(!el)return;el.classList.add('o');setTimeout(()=>{el.innerHTML=qHTML(S.quotes[qi]);el.classList.remove('o');cnt()},380)}
function renderHero(){if(qi<0||qi>=S.quotes.length)qi=pickQ();const h=cairoParts(new Date()).h,gr=S.gMode==='auto'?(h<12?'صباح الخير':h<18?'مساء الخير':'مساء النور'):S.gText;
 const dt=new Intl.DateTimeFormat('ar-EG-u-nu-latn',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'}).format(new Date()),hj=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{timeZone:TZ,day:'numeric',month:'long',year:'numeric'}).format(new Date());
 const done=Object.keys(PN).filter(k=>cur.today[k]<new Date()).length;const wc=W?WC(W.c):['—','cloud'];
 const wx=S.weather?`<div class="temp"><div class="n">${W?Math.round(W.t):'--'}<sup>°C</sup></div><p>الطقس الآن<strong>${wc[0]}${W?` · تُحس ${Math.round(W.f)}°`:''}</strong>${W?`<span>العظمى ${Math.round(W.hi)}° · الصغرى ${Math.round(W.lo)}°</span>`:'<span>يتطلب اتصالًا بالإنترنت</span>'}</p></div>`:'';
 $('hero').innerHTML=`<span class="chip dtc">${I('target')}${esc(dt)} · ${esc(hj)}</span><div class="main"><div class="chips">${S.chipText?`<span class="chip g">${I('bolt')}${esc(S.chipText)}</span>`:''}<span class="chip">${esc(S.place)}</span></div><h1>${esc(gr)}</h1>${wx}
 <div class="note"><div class="ico">${I(S.note.icon)}</div><div style="flex:1"><b>${esc(S.note.title)}</b><p>${esc(S.note.text)}</p><div class="seg">${Object.keys(PN).map((k,i)=>`<i class="${i<done?'f':''}"></i>`).join('')}</div></div></div></div>
 <div class="ringbox"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="84" fill="none" stroke="color-mix(in srgb,var(--ac) 14%,transparent)" stroke-width="12"/><circle id="rg" cx="100" cy="100" r="84" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${traw}" stroke-dashoffset="${traw}" style="transition:stroke-dashoffset 1s"/></svg><div class="c"><small>التالي</small><div class="big" id="rn">${PN[cur.nx.k]}</div><small id="rp">0%</small>${W&&S.weather?`<small style="margin-top:6px">${I(wc[1])} ${W.h}% رطوبة · ${Math.round(W.w)} كم/س</small>`:''}</div></div>
 <div class="qp"><div class="qh"><span class="qi">${I('quote')}</span><div><b>اقتباس</b><small id="qc"></small></div><button class="qn" id="qn" aria-label="التالي">${I('shuf')}</button></div><div class="qb" id="qb">${qHTML(S.quotes[qi])}</div><div class="qf"><i id="qp"></i></div></div>`;
 $('qn').onclick=nextQ;cnt(); render()}
$('pill').onclick=()=>{S.showTimes=!S.showTimes;save();document.body.classList.toggle('tm',S.showTimes)};
document.body.classList.toggle('tm',!!S.showTimes);
const tick=()=>{render();renderTimes();const f=$('qp');if(f)f.style.width=Math.min(100,(Date.now()-qAt)/(S.qEvery*1e3)*100)+'%';if(Date.now()-qAt>=S.qEvery*1e3)nextQ();const r=$('rn');if(r)r.textContent=PN[cur.nx.k]};
/* ---------- الإعدادات ---------- */
let tab='txt';
function drawer(){const tb=(k,t)=>`<button class="${tab===k?'a':''}" data-tab="${k}">${t}</button>`;let b='';
 if(tab==='txt')b=`<div class="f">العنوان الترحيبي<select data-s="gMode"><option value="auto" ${S.gMode==='auto'?'selected':''}>تلقائي حسب الوقت</option><option value="custom" ${S.gMode==='custom'?'selected':''}>نص مخصص</option></select><input data-s="gText" value="${esc(S.gText)}" placeholder="النص المخصص"></div>
 <div class="row"><label class="f">الشارة<input data-s="chipText" value="${esc(S.chipText)}"></label><label class="f">المكان<input data-s="place" value="${esc(S.place)}"></label></div>
 <div class="ec"><div class="f">البطاقة الرئيسية</div><div class="row" style="grid-template-columns:1fr 1fr"><input data-n="title" value="${esc(S.note.title)}"><select data-n="icon">${ICOPTS.map(o=>`<option ${S.note.icon===o?'selected':''}>${o}</option>`).join('')}</select></div><textarea data-n="text" rows="2">${esc(S.note.text)}</textarea></div>
 `;
 if(tab==='pr')b=`<label class="f">طريقة الحساب<select data-s="method">${Object.entries(METHODS).map(([k,v])=>`<option value="${k}" ${S.method===k?'selected':''}>${v[0]}</option>`).join('')}</select></label>
 <label class="f">مذهب العصر<select data-s="asr"><option value="1" ${S.asr==1?'selected':''}>الجمهور (شافعي/مالكي/حنبلي)</option><option value="2" ${S.asr==2?'selected':''}>الحنفي</option></select></label>
 <div class="sw">نظام 12 ساعة<input type="checkbox" data-s="h12" ${S.h12?'checked':''} style="width:auto"></div>
 <div class="f">تعديل دقائق كل صلاة (±)</div>${Object.keys(PN).map(k=>`<div class="adj">${PN[k]}<input type="number" data-a="${k}" value="${S.adj[k]||0}" min="-30" max="30"></div>`).join('')}`;
 if(tab==='qt')b=`<label class="f">تغيير الاقتباس كل<select data-s="qEvery">${[[15,'15 ثانية'],[30,'30 ثانية'],[60,'دقيقة'],[180,'3 دقائق'],[600,'10 دقائق']].map(([v,t])=>`<option value="${v}" ${S.qEvery==v?'selected':''}>${t}</option>`).join('')}</select></label>
 <div class="eq"><div class="f">إضافة سريعة — اقتباس في كل سطر، والمؤلف بعد " — "</div><textarea id="qbulk" rows="3" placeholder="النص — المؤلف"></textarea><button class="btn p" data-qbulk>${I('plus')} إضافة</button></div>
 <div class="sw"><b>${S.quotes.length} اقتباس</b><button class="btn" data-qadd>${I('plus')} اقتباس فارغ</button></div>
 ${S.quotes.map(q=>`<div class="eq" data-qid="${q.id}"><textarea data-q="text" rows="2" placeholder="نص الاقتباس">${esc(q.text)}</textarea><div class="r"><input data-q="author" value="${esc(q.author)}" placeholder="المؤلف / المصدر"><button class="btn x" data-qdel="${q.id}">${I('trash')}</button></div></div>`).join('')}`;
 if(tab==='ot')b=`<div class="sw">إظهار الطقس ودرجة الحرارة<input type="checkbox" data-s="weather" ${S.weather?'checked':''} style="width:auto"></div><div class="sw">الوضع الفاتح<input type="checkbox" data-s="light" ${S.theme==='light'?'checked':''} style="width:auto"></div>
 <div class="f">النسخ الاحتياطي</div><div class="row"><button class="btn p" data-ex>${I('down')} أخذ نسخة</button><label class="btn">${I('up')} استرجاع<input type="file" accept=".json" data-im hidden></label></div><button class="btn x" data-rs>إعادة الضبط</button>`;
 $('dr').innerHTML=`<div class="dh"><h2>تخصيص اللوحة</h2><button data-close>${I('x')}</button></div><div class="tabs">${tb('txt','النصوص')}${tb('pr','الصلوات')}${tb('qt','الاقتباسات')}${tb('ot','أخرى')}</div><div class="db">${b}</div>`}
const apply=()=>{save();document.documentElement.dataset.theme=S.theme;renderHero();renderTimes()};
const dr=$('dr');
dr.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.s){S[d.s]=t.type==='checkbox'?t.checked:(d.s==='asr'?+t.value:t.value);if(d.s==='light')S.theme=t.checked?'light':'dark'}
 else if(d.n)S.note[d.n]=t.value;else if(d.a)S.adj[d.a]=+t.value||0;
 else if(d.q){S.quotes.find(x=>x.id==t.closest('[data-qid]').dataset.qid)[d.q]=t.value}
 else if(d.c){S.cards.find(c=>c.id==t.closest('[data-id]').dataset.id)[d.c]=t.value}
 apply();if(d.s==='weather'&&S.weather)getW()});
dr.addEventListener('click',e=>{const t=e.target.closest('button,label');if(!t)return;const d2=t.dataset;
 if(d2.tab){tab=d2.tab;drawer()}
 else if(d2.qadd!==undefined){S.quotes.unshift({id:Date.now(),text:'',author:''});apply();drawer()}
 else if(d2.qdel){S.quotes=S.quotes.filter(q=>q.id!=d2.qdel);apply();drawer()}
 else if(d2.qbulk!==undefined){const v=$('qbulk').value.split('\n').map(x=>x.trim()).filter(Boolean);v.forEach((l,i)=>{const [a,...b]=l.split(' — ');S.quotes.push({id:Date.now()+i,text:a.trim(),author:b.join(' — ').trim()})});apply();drawer()}else if(d2.close!==undefined)document.body.classList.remove('open');
 else if(d2.add!==undefined){S.cards.push({id:Date.now(),icon:'star',label:'عنوان',value:'0',unit:'',note:''});apply();drawer()}
 else if(d2.del){S.cards=S.cards.filter(c=>c.id!=d2.del);apply();drawer()}
 else if(d2.ex!==undefined){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='dashboard-backup.json';a.click()}
 else if(d2.rs!==undefined&&confirm('إعادة كل الإعدادات للأصل؟')){S=structuredClone(DEF);apply();drawer()}});
dr.addEventListener('change',e=>{if(e.target.dataset.im!==undefined){const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{S=Object.assign(structuredClone(DEF),JSON.parse(x));apply();drawer()}catch(_){alert('ملف غير صالح')}})}});
$('gear').onclick=()=>{drawer();document.body.classList.add('open')};$('ov').onclick=()=>document.body.classList.remove('open');
document.documentElement.dataset.theme=S.theme;
tick();renderHero();renderTimes();getW();setInterval(tick,1e3);setInterval(()=>{renderTimes();renderHero()},6e4);setInterval(getW,9e5);
</script>
</body>
</html>
